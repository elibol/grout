[package]
name = "grout"
version = "0.1.0"
edition = "2024"
default-run = "grout"
autobins = false

[dependencies]
libloading = "0.8"
anyhow = "1.0.102"
clap = { version = "4.5.60", features = ["derive"] }
memmap2 = "0.9.10"
rand = "0.8.5"
rayon = "1.11.0"
safetensors = "0.7.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros"] }
tokenizers = "0.20.4"

cudarc = { version = "0.19.2", default-features = false, features = ["std", "cublas", "dynamic-loading", "cuda-13010"] }

cuda-bindings = "0.3.0"
cuda-core = "0.3.0"
cuda-async = "0.3.0"
cutile-compiler = "0.3.0"
cutile = { version = "0.3.0", features = ["experimental-tune"] }

# VALIDATION BRANCH: cutile-rs 0.3.1 line. Validated first against main @
# 447e906cb24d08fe8ccf13ed8dc9874ddc5d7c76 (PR #258), then against the local
# ../cutile-rs checkout at 53ff737 (branch perf/launch-hot-path, which
# includes the v0.3.1 release 9f68be2). The "0.3.0" requirements below accept
# 0.3.1 under semver, so the crates.io patch applies. Git-dependency spelling:
#   { git = "https://github.com/NVlabs/cutile-rs", rev = "447e906cb24d08fe8ccf13ed8dc9874ddc5d7c76" }
# Baseline (safe-kernels branch) points at the ../cutile-rs-v0.3.0 worktree;
# src/driver_compat.rs lets this same source build against either revision.
[patch.crates-io]
cuda-bindings = { path = "../cutile-rs/cuda-bindings" }
cuda-core = { path = "../cutile-rs/cuda-core" }
cuda-async = { path = "../cutile-rs/cuda-async" }
cutile-compiler = { path = "../cutile-rs/cutile-compiler" }
cutile = { path = "../cutile-rs/cutile" }

[features]
benchmarks = []

[[bin]]
name = "grout"
path = "src/main.rs"

[[bin]]
name = "grout_bench"
path = "benchmarks/src/bin/grout_bench.rs"
required-features = ["benchmarks"]

[[bin]]
name = "grout_autotune"
path = "benchmarks/src/bin/grout_autotune.rs"
required-features = ["benchmarks"]

[[bin]]
name = "gemm_check_ablation"
path = "benchmarks/src/bin/gemm_check_ablation.rs"
required-features = ["benchmarks"]

[[bin]]
name = "attention_microbench"
path = "benchmarks/src/bin/attention_microbench.rs"
required-features = ["benchmarks"]

[[bin]]
name = "gemv_microbench"
path = "benchmarks/src/bin/gemv_microbench.rs"
required-features = ["benchmarks"]

[[bin]]
name = "group_gemm_microbench"
path = "benchmarks/src/bin/group_gemm_microbench.rs"
required-features = ["benchmarks"]

[[bin]]
name = "persistent_gemm_microbench"
path = "benchmarks/src/bin/persistent_gemm_microbench.rs"
required-features = ["benchmarks"]
